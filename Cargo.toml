[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/ipc",
    "crates/tracker-win",
    "crates/tracker-linux",
    "crates/enforce-win",
    "crates/enforce-linux",
    "crates/agent",
    "crates/session",
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["screentime contributors"]
repository = ""

[workspace.dependencies]
# Internal
st-core = { path = "crates/core" }
st-storage = { path = "crates/storage" }
st-ipc = { path = "crates/ipc" }
st-tracker-win = { path = "crates/tracker-win" }
st-tracker-linux = { path = "crates/tracker-linux" }
st-enforce-win = { path = "crates/enforce-win" }
st-enforce-linux = { path = "crates/enforce-linux" }

# External
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
argon2 = { version = "0.5", features = ["rand"] }

# Platform
windows = "0.58"
x11rb = "0.13"
nix = { version = "0.29", features = ["signal", "process"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
# Sampling loops are unusably slow in a fully unoptimised debug build.
opt-level = 1

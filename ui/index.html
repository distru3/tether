<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tether</title>
        <link rel="icon" type="image/png" href="/tether-logo.png" />
        <script>
            (function () {
                try {
                    // Mirrors normalizePref in src/hooks/useTheme.ts.
                    var pref = localStorage.getItem("tether_theme");
                    var dark = ["dark", "midnight-cobalt", "slate-charcoal", "cyber-emerald", "horizon-dark", "classic-dark"];
                    var light = ["light", "clean-titanium", "nordic-frost", "horizon-light", "classic-light"];
                    var effective;
                    if (dark.indexOf(pref) >= 0) effective = "dark";
                    else if (light.indexOf(pref) >= 0) effective = "light";
                    else effective = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", effective);
                    document.documentElement.setAttribute("data-theme-mode", effective);
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

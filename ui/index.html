<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tether</title>
        <link rel="icon" type="image/png" href="/tether-logo.png" />
        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
        <script>
            (function () {
                try {
                    var pref = localStorage.getItem("tether_theme");
                    if (pref === "dark" || pref === "horizon-dark" || pref === "classic-dark") pref = "midnight-cobalt";
                    if (pref === "light" || pref === "horizon-light" || pref === "classic-light") pref = "clean-titanium";
                    var effective = "midnight-cobalt";
                    if (pref === "midnight-cobalt" || pref === "cyber-emerald" || pref === "clean-titanium" || pref === "nordic-frost") {
                        effective = pref;
                    } else {
                        var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                        effective = isDark ? "midnight-cobalt" : "clean-titanium";
                    }
                    document.documentElement.setAttribute("data-theme", effective);
                    var isLight = effective === "clean-titanium" || effective === "nordic-frost";
                    document.documentElement.setAttribute("data-theme-mode", isLight ? "light" : "dark");
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

[package]
name = "st-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "screentime-agent"
path = "src/main.rs"

[dependencies]
st-core.workspace = true
st-storage.workspace = true
st-ipc.workspace = true
anyhow.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Daily-rolling file logs: when the agent runs hidden or as a service, stdout
# is discarded by whoever spawned it, so incidents need an on-disk trail.
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
st-tracker-win.workspace = true
st-enforce-win.workspace = true
# CreateMutexW-based single-instance guard lives here.
st-win32 = { path = "../st-win32" }
# SetConsoleCtrlHandler for graceful Ctrl+C/service-stop handling.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }
# Windows-service plumbing: SCM dispatcher (ServiceMain), STOP control
# handling and status reporting. Hand-rolling StartServiceCtrlDispatcherW
# marshalling is error-prone; this crate wraps exactly that surface.
windows-service = "0.8"

[target.'cfg(unix)'.dependencies]
st-tracker-linux.workspace = true
st-enforce-linux.workspace = true
# SIGINT/SIGTERM handling for graceful shutdown (signal feature).
nix.workspace = true

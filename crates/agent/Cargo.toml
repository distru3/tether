[package]
name = "st-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "screentime-agent"
path = "src/main.rs"

[dependencies]
st-core.workspace = true
st-storage.workspace = true
st-ipc.workspace = true
anyhow.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
st-tracker-win.workspace = true
st-enforce-win.workspace = true
# SetConsoleCtrlHandler for graceful Ctrl+C/service-stop handling.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
st-tracker-linux.workspace = true
st-enforce-linux.workspace = true
# SIGINT/SIGTERM handling for graceful shutdown (signal feature).
nix.workspace = true

name: ci

on:
    push:
        branches: [main]
    pull_request:

# Cancel in-progress runs for the same ref: a fresh push supersedes the old one,
# and burning CI minutes on obsolete commits is pointless.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: cargo build & test
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            # `rust-toolchain.toml` pins the version; dtolnay's action honours it.
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            # Tauri and X11 dev headers. Only needed on Linux runners; Windows
            # builds don't touch the Linux crates.
            - name: Install Linux dev packages
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libx11-dev \
                    libxss-dev

            - run: cargo fmt --all -- --check
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo test --workspace --all-features

    ui:
        name: frontend build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ui
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: ui/package-lock.json
            # Lockfile is committed; `npm ci` keeps installs reproducible.
            - run: npm ci
            - run: npm run build
